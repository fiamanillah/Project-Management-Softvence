info:
  name: Create Department
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/organization/departments"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "code": "ENG",
        "name": "Engineering",
        "isActive": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
