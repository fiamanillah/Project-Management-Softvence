info:
  name: Update Department
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/organization/departments/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Engineering & Technology",
        "isActive": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
