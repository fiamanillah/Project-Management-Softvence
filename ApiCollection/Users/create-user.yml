info:
  name: Create User
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "Password123!",
        "firstName": "John",
        "lastName": "Doe",
        "systemRole": "Staff",
        "designationId": "00000000-0000-0000-0000-000000000000"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
