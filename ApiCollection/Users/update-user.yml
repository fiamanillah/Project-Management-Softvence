info:
  name: Update User
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/users/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "systemRole": "Admin",
        "isActive": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
