    data: |-
      {
        "userId": "00000000-0000-0000-0000-000000000000",
        "permissionId": "00000000-0000-0000-0000-000000000000",
        "isDeny": false,
        "reason": "Special project requirement"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
