info:
  name: Logout User
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "refreshToken": "OPTIONAL_REFRESH_TOKEN_HERE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
